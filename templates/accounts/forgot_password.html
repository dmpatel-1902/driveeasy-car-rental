{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card car-card p-4">

                <h3 class="text-center mb-1">Forgot Password?</h3>
                <p class="text-center text-muted mb-4">
                    Enter your registered email address, we'll send you an OTP to reset your password.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="you@example.com"
                            autofocus
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary-brand w-100">Send OTP</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Remembered your password? <a href="{% url 'accounts:login' %}">Login</a>
                </p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
